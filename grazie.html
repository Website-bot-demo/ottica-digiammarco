<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iscrizione confermata · Ottica Di Giammarco</title>
<meta name="robots" content="noindex">
<link rel="icon" href="img/logo.png">
<style>
  @font-face { font-family: "Instrument Serif"; font-style: normal; font-weight: 400; font-display: swap; src: url("fonts/instrument-serif-latin-400-normal.woff2") format("woff2"); }
  @font-face { font-family: "Figtree"; font-style: normal; font-weight: 400; font-display: swap; src: url("fonts/figtree-latin-400-normal.woff2") format("woff2"); }
  @font-face { font-family: "Figtree"; font-style: normal; font-weight: 600; font-display: swap; src: url("fonts/figtree-latin-600-normal.woff2") format("woff2"); }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 18px; background: #f3f5fa; color: #141b33; font-family: "Figtree", system-ui, -apple-system, "Segoe UI", Arial, sans-serif; font-size: 17px; line-height: 1.6; }
  .card { width: min(520px, 100%); background: #fff; border: 1px solid #e1e5ef; border-radius: 18px; padding: 36px 28px 30px; text-align: center; box-shadow: 0 18px 40px rgba(20, 27, 51, .08); }
  .card img { display: block; width: 170px; height: auto; margin: 0 auto 22px; }
  .ok { width: 54px; height: 54px; margin: 0 auto 14px; border-radius: 50%; display: grid; place-items: center; background: linear-gradient(135deg, #f0cf86, #d4a017); }
  h1 { font-family: "Instrument Serif", Georgia, serif; font-weight: 400; color: #1d2a5c; font-size: clamp(34px, 8vw, 44px); line-height: 1.05; margin: 0 0 12px; }
  p { margin: 0 auto 12px; max-width: 38ch; color: #59627a; }
  p strong { color: #141b33; }
  .btn { display: inline-block; margin-top: 12px; padding: 13px 26px; border-radius: 999px; background: #1d2a5c; color: #fff; font-weight: 600; text-decoration: none; }
</style>
</head>
<body>
  <main class="card">
    <img src="img/logo.png" alt="Ottica Di Giammarco" width="388" height="232">
    <div class="ok" aria-hidden="true"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#0a0a0a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
    <h1>Iscrizione confermata!</h1>
    <p>Ti abbiamo appena inviato <strong>il tuo codice sconto Black Friday</strong> via email.</p>
    <p>Non la trovi? Controlla anche in <strong>Spam</strong> o <strong>Promozioni</strong>.</p>
    <a class="btn" href="./">Torna al sito</a>
  </main>
</body>
</html>
